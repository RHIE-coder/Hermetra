# steward — 이 프로젝트에 붙인 하네스 설정 (setup 이 깔아 줌)
core: steward
managed_by: steward
schema_version: 1
# 작업 바통 폴더 이름. 이 프로젝트는 브랜치를 안 쓰므로(CLAUDE.md §6) 단계를 태우는 작업은
# 시작할 때 아래 줄의 주석을 풀고 슬러그를 적고, 끝나면 다시 주석으로 덮는다. 비어 있는 동안은
# 커밋 관문이 안 선다 — 바통 없는 `[direct]` 수정이 격식 없이 커밋되는 것이 의도다.
#
# **값만 지우고 `feature:` 를 남기지 말 것.** 읽는 쪽이 `/^feature:\s*(.+)$/m` 이고 `\s*` 가
# 줄바꿈을 먹으므로, 값이 빈 `feature:` 는 *다음 줄*을 값으로 집는다 — 바통 폴더가 `phases:`
# 라는 이름으로 생긴다(실측). 키째로 주석 처리해야 git 브랜치(= `main`) 로 제대로 떨어진다.
# feature: <슬러그>
phases:
  - intake
  - spec
  - build
  - review
  - gate
  - report
  - immunize
values:
  glossary_path: "docs/glossary.md"
  spec_dir: "docs/spec"
  qa_dir: "docs/qa"
  # routed — 순수 로직(main/bridge)·IPC 계약·스키마는 테스트 먼저, UI·e2e 는 구현 후 테스트 허용.
  tdd_mode: "routed"
  # 정적 검사 = 타입 + lint. 둘 다 초록이어야 build·gate 를 통과한다.
  typecheck_command: "npm run typecheck && npm run lint"
  test_command: "npm run test"
  build_command: "npm run build"
bindings:
  ui-preview: "./.harness/steward/project/impl/ui-preview.md"
  ui-shot: "node .harness/steward/project/impl/ui-shot.mjs"
  # token-guard 는 디자인 토큰만이 아니라 이 프로젝트의 전체 드리프트 검사를 부른다
  # (토큰 · 계층 임포트 · i18n en/ko 짝 · 커버리지 · immunity ledger).
  # 2026-07-28 기준선: 5개 검사 전부 PASS. FAIL 이 보이면 이번 변경이 낸 것이다.
  token-guard: "npm run sweep"
  # 대비 판정은 surface-verify 계약의 검사 하나다 — 같은 어댑터·판정기를 쓴다.
  contrast-check: "node .harness/steward/project/impl/surface-verify.mjs"
  e2e-runner: "npm run test:e2e"
  # Electron(browser 프로파일) 표면 어댑터. 화면 9개 × 폼팩터 3개 × 테마 2개를 렌더해
  # 정규화 모델을 <바통>/surface-verify.json 에 남기고, 판정기(surface-checks.mjs)가
  # 대비·겹침·잘림·범위밖·렌더에러·터치표적을 본다. 기준선은 project/surface-baseline.json.
  surface-verify: "node .harness/steward/project/impl/surface-verify.mjs"
impl: {}

# UI 게이팅 — 스테이징된 변경이 이 글롭에 걸리면 커밋 전에 surface-verify 기록을 요구하고,
# 훅이 판정기를 직접 다시 돌린다("통과했다"는 말을 안 믿는다).
ui_globs:
  - "src/renderer/**/*.tsx"
  - "src/renderer/styles/**/*.css"
  - "tailwind.config.ts"
